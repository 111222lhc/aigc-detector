name: 缺陷报告
description: 报告可复现的功能、解析、检测报告或界面问题。
title: "[缺陷]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿粘贴真实论文全文、访问令牌、支付信息或其他个人数据。
  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 用一句话说明实际发生了什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 上传或输入…（请使用脱敏测试文本）
        3. 点击…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 浏览器、系统和版本
      placeholder: 例如 Chrome 版本、Windows/macOS、部署版本
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除或替换真实论文、个人信息、令牌和密码。
          required: true
